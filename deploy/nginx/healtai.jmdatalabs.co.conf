# healthAI · nginx para healtai.jmdatalabs.co
#
# Instalar:
#   sudo cp deploy/nginx/healtai.jmdatalabs.co.conf /etc/nginx/sites-available/healtai.jmdatalabs.co
#   sudo ln -s /etc/nginx/sites-available/healtai.jmdatalabs.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d healtai.jmdatalabs.co     # añade HTTPS y la redirección desde el puerto 80
#
# Un solo dominio: el front se sirve en "/" y la API en "/api/" (se quita el prefijo al reenviar).
# El puerto 8010 debe coincidir con BACKEND_PORT de .env.production.

# Límite de intentos de ingreso por IP (la API ya bloquea la cuenta tras 5 fallos; esto frena el barrido de cuentas).
map $uri $healthai_login_key {
    default "";
    ~^/api/(admin/)?auth/login$ $binary_remote_addr;
}
limit_req_zone $healthai_login_key zone=healthai_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=healthai_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name healtai.jmdatalabs.co;

    root /home/gestionacademicasoft/apps/frontend/healthai;
    index index.html;

    # Los lotes admiten hasta 5 MB.
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── API (FastAPI bajo pm2) ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=healthai_login burst=5 nodelay;
        limit_req zone=healthai_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Front (SPA) ─────────────────────────────────────────────────────────────
    # Los archivos con hash en el nombre no cambian nunca: caché larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cualquier otra ruta (/login, /admin, /evaluacion/…) la resuelve React Router.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
