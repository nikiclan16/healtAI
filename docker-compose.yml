# healthAI · configuración base (apta para producción: sin datos de demostración ni documentación abierta).
#
# Desarrollo:  docker compose up -d --build
#   (Compose carga también docker-compose.override.yml: usuarios de demostración y /docs)
# Producción:  docker compose -f docker-compose.yml up -d --build   (ver DEPLOY.md)
# Pruebas del backend: docker compose run --rm --build backend pytest
name: healthai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env (copie .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-healthai}
    ports:
      # Solo accesible desde esta máquina.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts se ejecutan en orden alfabético solo al crear el volumen.
      - ./infra/db/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-healthai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-healthai}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en .env (mínimo 32 caracteres)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Modelo: por defecto se exige un artefacto REAL en backend/model_artifacts/model.json.
      # El de prueba (placeholder) solo se carga si ALLOW_PLACEHOLDER_MODEL=true (solo desarrollo).
      MODEL_ARTIFACT_PATH: ${MODEL_ARTIFACT_PATH:-model_artifacts/model.json}
      ALLOW_PLACEHOLDER_MODEL: ${ALLOW_PLACEHOLDER_MODEL:-false}
      # Documentación interactiva (/docs): solo desarrollo.
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      # Administrador inicial (solo se crea si no existe ningún admin activo).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # El modelo real se instala aquí (solo lectura); no va dentro de la imagen.
      - ./backend/model_artifacts:/app/model_artifacts:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

volumes:
  pgdata:
